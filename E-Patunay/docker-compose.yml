services:
  postgres:
    image: postgres:16-alpine
    container_name: epatunay-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: epatunay
      POSTGRES_USER: epatunay
      POSTGRES_PASSWORD: epatunay_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epatunay"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: epatunay-keycloak
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/epatunay
      KC_DB_USERNAME: epatunay
      KC_DB_PASSWORD: epatunay_secret
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
